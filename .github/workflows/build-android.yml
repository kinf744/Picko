name: Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'

jobs:
  build-android:
    name: Build APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install JavaScript dependencies
        env:
          NODE_ENV: development
        run: pnpm install --frozen-lockfile --prod=false

      - name: Validate TypeScript and tests
        env:
          NODE_ENV: development
        run: |
          pnpm check
          pnpm vitest run

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Materialize release signing key
        env:
          PICKO_RELEASE_KEYSTORE_BASE64: ${{ secrets.PICKO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$PICKO_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$PICKO_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/picko-release.keystore"
          chmod 600 "$RUNNER_TEMP/picko-release.keystore"

      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          PICKO_RELEASE_STORE_FILE: ${{ runner.temp }}/picko-release.keystore
          PICKO_RELEASE_STORE_PASSWORD: ${{ secrets.PICKO_RELEASE_STORE_PASSWORD }}
          PICKO_RELEASE_KEY_ALIAS: ${{ secrets.PICKO_RELEASE_KEY_ALIAS }}
          PICKO_RELEASE_KEY_PASSWORD: ${{ secrets.PICKO_RELEASE_KEY_PASSWORD }}
          PICKO_RELEASE_CERT_SHA256: ${{ secrets.PICKO_RELEASE_CERT_SHA256 }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: kighmu-vpn-android-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
