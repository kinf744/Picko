name: Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'
  GO_VERSION: '1.23.x'
  HYSTERIA_GO_VERSION: '1.20.14'
  DNSTT_REVISION: '0c5c52a57d899c05428c116898941761a2ed83c2'
  HYSTERIA_VERSION: 'v1.3.5'
  ANDROID_NDK_VERSION: '27.2.12479018'

jobs:
  build-android:
    name: Build APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go for dnstt ARMv7
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Android NDK for dnstt ARMv7
        uses: android-actions/setup-android@v3

      - name: Install pinned Android NDK
        run: sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Build isolated dnstt clients for Android armeabi-v7a
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/dnstt"
          OUTPUT_DIR="${GITHUB_WORKSPACE}/modules/kighmu-vpn-native/android/src/main/jniLibs/armeabi-v7a"
          OUTPUT="${OUTPUT_DIR}/libdnstt.so"
          NDK_ROOT="${ANDROID_HOME}/ndk/${{ env.ANDROID_NDK_VERSION }}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="${TOOLCHAIN}/armv7a-linux-androideabi24-clang"
          CXX="${TOOLCHAIN}/armv7a-linux-androideabi24-clang++"
          test -x "$CC"
          test -x "$CXX"
          rm -rf "$SOURCE_DIR"
          git clone https://www.bamsoftware.com/git/dnstt.git "$SOURCE_DIR"
          git -C "$SOURCE_DIR" checkout --detach "$DNSTT_REVISION"
          mkdir -p "$OUTPUT_DIR"
          (
            cd "$SOURCE_DIR"
            CGO_ENABLED=1 CC="$CC" CXX="$CXX" GOOS=android GOARCH=arm GOARM=7 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o "$OUTPUT" ./dnstt-client
          )
          chmod 755 "$OUTPUT"
          test -s "$OUTPUT"
          chmod 755 "$OUTPUT"
          find "$OUTPUT_DIR" -maxdepth 1 -type f -name 'libdnstt-*.so' -delete
          file "$OUTPUT"

      - name: Setup Go for Hysteria v1 ARMv7
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.HYSTERIA_GO_VERSION }}

      - name: Build Hysteria v1 client for Android armeabi-v7a
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/hysteria"
          OUTPUT="${GITHUB_WORKSPACE}/modules/kighmu-vpn-native/android/src/main/jniLibs/armeabi-v7a/libhysteria.so"
          NDK_ROOT="${ANDROID_HOME}/ndk/${{ env.ANDROID_NDK_VERSION }}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="${TOOLCHAIN}/armv7a-linux-androideabi24-clang"
          CXX="${TOOLCHAIN}/armv7a-linux-androideabi24-clang++"
          rm -rf "$SOURCE_DIR"
          git clone --depth 1 --branch "$HYSTERIA_VERSION" https://github.com/HyNetwork/hysteria.git "$SOURCE_DIR"
          (
            cd "$SOURCE_DIR"
            CGO_ENABLED=1 CC="$CC" CXX="$CXX" GOOS=android GOARCH=arm GOARM=7 \
              go build -trimpath -buildvcs=false -buildmode=pie -ldflags='-s -w -extldflags=-pie' \
              -o "$OUTPUT" ./app/cmd
          )
          chmod 755 "$OUTPUT"
          test -s "$OUTPUT"
          file "$OUTPUT"

      - name: Verify native tunnel artifacts
        run: |
          set -euo pipefail
          OUTPUT_DIR="${GITHUB_WORKSPACE}/modules/kighmu-vpn-native/android/src/main/jniLibs/armeabi-v7a"
          for artifact in libhev-socks5-tunnel.so libuz_core.so libxray.so libdnstt.so libhysteria.so; do
            test -s "$OUTPUT_DIR/$artifact"
            test -x "$OUTPUT_DIR/$artifact"
            file "$OUTPUT_DIR/$artifact" | grep -E 'ARM|shared object|executable'
          done
          test ! -e "$OUTPUT_DIR/libtun2socks.so"
          test ! -e "$OUTPUT_DIR/libbridge.so"
          echo "Artefacts natifs armeabi-v7a validés"

      - name: Install JavaScript dependencies
        env:
          NODE_ENV: development
        run: pnpm install --frozen-lockfile --prod=false

      - name: Validate TypeScript and tests
        env:
          NODE_ENV: development
        run: |
          pnpm check
          pnpm vitest run

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        run: ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Report release APK size
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          BYTES=$(stat -c '%s' "$APK")
          MIB=$(awk "BEGIN { printf \"%.2f\", $BYTES / 1048576 }")
          echo "APK release : $BYTES octets ($MIB Mio)"
          echo "### Taille APK release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fichier : \`$(basename "$APK")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Taille : **$BYTES octets ($MIB Mio)**" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: kighmu-vpn-android-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
