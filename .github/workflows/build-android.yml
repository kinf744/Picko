name: Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'
  ANDROID_NDK_VERSION: '27.2.12479018'

jobs:
  build-android:
    name: Build APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Android NDK for CMake
        uses: android-actions/setup-android@v3

      - name: Install pinned Android NDK
        run: sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Verify native tunnel artifacts
        run: |
          set -euo pipefail
          OUTPUT_DIR="${GITHUB_WORKSPACE}/modules/kighmu-vpn-native/android/src/main/jniLibs/armeabi-v7a"
          for artifact in libhev-socks5-tunnel.so libuz_core.so libxray.so libdnstt.so libhysteria.so; do
            test -s "$OUTPUT_DIR/$artifact"
            file "$OUTPUT_DIR/$artifact" | grep -E 'ARM|shared object|executable'
          done
          chmod 755 "$OUTPUT_DIR/libuz_core.so" "$OUTPUT_DIR/libxray.so" "$OUTPUT_DIR/libdnstt.so" "$OUTPUT_DIR/libhysteria.so"
          for executable in libuz_core.so libxray.so libdnstt.so libhysteria.so; do
            test -x "$OUTPUT_DIR/$executable"
          done
          test ! -e "$OUTPUT_DIR/libtun2socks.so"
          test ! -e "$OUTPUT_DIR/libbridge.so"
          test ! -e "$OUTPUT_DIR/libxray-v2ray.so"
          test ! -e "$OUTPUT_DIR/libxray-v2rayslowdns.so"
          echo "Artefacts natifs armeabi-v7a validés"

      - name: Install JavaScript dependencies
        env:
          NODE_ENV: development
        run: pnpm install --frozen-lockfile --prod=false

      - name: Audit JavaScript dependencies
        env:
          NODE_ENV: development
        run: |
          set -euo pipefail
          if ! pnpm audit --prod --json > /tmp/audit.json 2>/tmp/audit.err; then
            echo "## pnpm audit summary" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/audit.err >> "$GITHUB_STEP_SUMMARY" || true
            cat /tmp/audit.json >> "$GITHUB_STEP_SUMMARY" || true
            echo "::warning::pnpm audit a remonté des vulnérabilités (voir résumé)."
          fi

      - name: Validate TypeScript and tests
        env:
          NODE_ENV: development
        run: |
          pnpm check
          pnpm vitest run

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        run: ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Report release APK size
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          BYTES=$(stat -c '%s' "$APK")
          MIB=$(awk "BEGIN { printf \"%.2f\", $BYTES / 1048576 }")
          echo "APK release : $BYTES octets ($MIB Mio)"
          echo "### Taille APK release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fichier : \`$(basename "$APK")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Taille : **$BYTES octets ($MIB Mio)**" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: kighmu-vpn-android-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
