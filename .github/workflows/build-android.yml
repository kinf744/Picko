name: Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'
  GO_VERSION: '1.23.x'
  DNSTT_REVISION: '0c5c52a57d899c05428c116898941761a2ed83c2'

jobs:
  build-android:
    name: Build APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go for dnstt ARMv7
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build official dnstt client for Android armeabi-v7a
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/dnstt"
          OUTPUT="${GITHUB_WORKSPACE}/modules/kighmu-vpn-native/android/src/main/jniLibs/armeabi-v7a/libdnstt.so"
          rm -rf "$SOURCE_DIR"
          git clone https://www.bamsoftware.com/git/dnstt.git "$SOURCE_DIR"
          git -C "$SOURCE_DIR" checkout --detach "$DNSTT_REVISION"
          mkdir -p "$(dirname "$OUTPUT")"
          (
            cd "$SOURCE_DIR"
            CGO_ENABLED=0 GOOS=android GOARCH=arm GOARM=7 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o "$OUTPUT" ./dnstt-client
          )
          chmod 755 "$OUTPUT"
          test -s "$OUTPUT"
          file "$OUTPUT"

      - name: Install JavaScript dependencies
        env:
          NODE_ENV: development
        run: pnpm install --frozen-lockfile --prod=false

      - name: Validate TypeScript and tests
        env:
          NODE_ENV: development
        run: |
          pnpm check
          pnpm vitest run

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        run: ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: kighmu-vpn-android-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
