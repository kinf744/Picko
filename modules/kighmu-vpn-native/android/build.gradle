apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

group = 'expo.modules.kighmuvpnnative'
version = ''

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "expo.modules.kighmuvpnnative"
  defaultConfig {
    versionCode 1
    versionName ""
    ndk {
      abiFilters "armeabi-v7a"
    }
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17 -fexceptions -frtti"
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path file("src/main/cpp/CMakeLists.txt")
    }
  }
  packagingOptions {
    jniLibs {
      useLegacyPackaging true
    }
  }
  lintOptions {
    abortOnError false
  }
}

 dependencies {
   implementation('org.connectbot:sshlib:2.2.21') {
     exclude group: 'com.google.crypto.tink'
   }
   // BouncyCastle : fournit AES-256/CTR et Ed25519 sans restriction JCE
   // (contourne "Fatal error during MAC startup" sur les périphériques où le
   // provider par défaut refuse AES-256). Présent dans Zamois-tun (app qui marche).
   implementation 'org.bouncycastle:bcprov-jdk15to18:1.77'
 }
