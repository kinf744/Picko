apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

group = 'expo.modules.kighmuvpnnative'
version = ''

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

def releaseCertSha256 = (findProperty('PICKO_RELEASE_CERT_SHA256') ?: System.getenv('PICKO_RELEASE_CERT_SHA256') ?: '')
  .toString().replaceAll('[^A-Fa-f0-9]', '').toUpperCase()
def integrityEnforced = !releaseCertSha256.isBlank()

android {
  namespace "expo.modules.kighmuvpnnative"
  defaultConfig {
    versionCode 1
    versionName ""
    buildConfigField "String", "PICKO_RELEASE_CERT_SHA256", "\"${releaseCertSha256}\""
    buildConfigField "boolean", "PICKO_INTEGRITY_ENFORCED", integrityEnforced.toString()
    ndk {
      abiFilters "armeabi-v7a"
    }
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17 -fexceptions -frtti"
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path file("src/main/cpp/CMakeLists.txt")
    }
  }
  packagingOptions {
    jniLibs {
      useLegacyPackaging true
    }
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation('org.connectbot:sshlib:2.2.21') {
    exclude group: 'com.google.crypto.tink'
  }
}
